[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "minecraft-rl-lab"
version = "0.1.0"
description = "Inspectable reinforcement learning experiments toward a Minecraft agent"
requires-python = "==3.12.*"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.13.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/minecraft_rl"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
