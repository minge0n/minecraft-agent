plugins {
    // `net.fabricmc.fabric-loom` (not the legacy `fabric-loom`) is the plugin ID for
    // unobfuscated Minecraft versions, which 26.3 is.
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = 'mcbot'
}

// Game run data lives in the repository-owned .runtime directory that
// ./scripts/gradle creates, so runs never touch a personal Minecraft install.
def runtimeMinecraftDir = layout.projectDirectory.dir('../../.runtime/minecraft')

// `-Pmcbot.worker=NNNN` runs the client as isolated environment worker env-NNNN: its
// own game directory (options, saves, logs, crash reports) and the deterministic
// offline development identity AgentNNNN (docs/decisions/parallel-workers.md).
def worker = providers.gradleProperty('mcbot.worker').orNull
if (worker != null && !(worker ==~ /\d{4}/)) {
    throw new GradleException("mcbot.worker must be four digits, got '${worker}'")
}

// Client renderer (docs/decisions/simulation-throughput.md). `vanilla` (the
// default, the measured best) runs neither mod, `sodium` runs Sodium alone,
// `sodium-extra` runs Sodium and Sodium Extra with Reduce Resolution on macOS.
// The mods are development runtime dependencies only: they are never bundled
// into the mcbot jar and never change what a step does.
def renderer = providers.gradleProperty('mcbot.renderer').orElse('vanilla').get()
if (!(renderer in ['vanilla', 'sodium', 'sodium-extra'])) {
    throw new GradleException("mcbot.renderer must be vanilla, sodium or sodium-extra, got '${renderer}'")
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

loom {
    runs {
        configureEach {
            runDirectory = runtimeMinecraftDir.dir(name)
            property 'mcbot.renderer', renderer
        }
        if (worker != null) {
            client {
                runDirectory = layout.projectDirectory.dir("../../.runtime/workers/${worker}/client")
                programArgs '--username', "Agent${worker}"
            }
        }
    }
}

dependencies {
    // Minecraft 26.3 ships official Mojang names, so no `mappings` dependency
    // is needed or accepted here.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // The unobfuscated Loom has no `mod*` configurations: `localRuntime` is
    // its `modLocalRuntime`, on the dev run classpath and never published.
    if (renderer != 'vanilla') {
        localRuntime "maven.modrinth:${project.sodium_project}:${project.sodium_version}"
    }
    if (renderer == 'sodium-extra') {
        localRuntime "maven.modrinth:${project.sodium_extra_project}:${project.sodium_extra_version}"
    }

    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

processResources {
    def props = [
        version       : project.version,
        minecraft     : project.minecraft_version,
        loader        : project.loader_version,
        java          : project.java_version,
    ]
    props.each { key, value -> inputs.property key, value }

    filesMatching('fabric.mod.json') {
        expand props
    }
}

def javaVersion = JavaLanguageVersion.of(project.java_version as int)

java {
    // ./scripts/gradle runs Gradle on the pinned local Temurin JDK 25, so the
    // toolchain is satisfied without downloading another JDK.
    toolchain {
        languageVersion = javaVersion
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = project.java_version as int
    options.encoding = 'UTF-8'
}
