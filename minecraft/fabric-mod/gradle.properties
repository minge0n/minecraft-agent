# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Loom is not yet configuration-cache compatible when imported by IntelliJ.
# See https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Minecraft / Fabric versions.
# 26.3 is an unobfuscated Minecraft release, so no `mappings` dependency is
# declared: the game already ships official Mojang names.
minecraft_version=26.3
loader_version=0.19.5
fabric_api_version=0.161.0+26.3
loom_version=1.18.2

# Minecraft 26.3 requires Java 25 (version_manifest javaVersion.majorVersion=25).
java_version=25

# Fast unit tests for mod-owned logic that does not need a running game.
junit_version=6.1.3

# Mod
mod_version=0.1.0
maven_group=com.mcbot
